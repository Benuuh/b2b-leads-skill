name: skill-core-postgresql
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: acq
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: skill_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U acq" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SCA_DATABASE_URL: postgresql+psycopg://acq:synthetic-ci-password@127.0.0.1:5432/skill_ci
      SCA_FIXTURE_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r backend/requirements.lock && python -m pip install --no-deps -e backend
      - run: python scripts/b2b_leads.py --help
      - run: python -m pytest backend/tests -q --junitxml=skill-core-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: skill-core-test-report, path: skill-core-junit.xml}
  install:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pip install --no-deps -e backend
      - run: python -m pytest backend/tests/test_release.py backend/tests/test_cli.py -q
